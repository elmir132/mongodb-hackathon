[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-retrieval"
version = "0.1.0"
description = "Chronicle precedent retrieval (Danny) — Voyage AI + Atlas Vector Search"
readme = "retrieval/README.md"
requires-python = ">=3.10"
dependencies = [
  "voyageai>=0.3.2",
  "pymongo>=4.6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
